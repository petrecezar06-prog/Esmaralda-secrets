<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esmaralda's Secrets</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid #334155;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        p {
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0369a1;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-size: 0.9rem;
        }

        .message.success {
            background-color: #065f46;
            color: #a7f3d0;
            display: block;
        }

        .message.error {
            background-color: #991b1b;
            color: #fecaca;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Esmaralda's Secrets</h1>
        <p>Introdu codul secret pentru a debloca conținutul ascuns.</p>
        
        <form id="secret-form">
            <div class="input-group">
                <input type="password" id="secret-key" placeholder="Introdu codul de acces..." required>
            </div>
            <button type="submit">Verifică Codul</button>
        </form>

        <div id="response-message" class="message"></div>
    </div>

    <script>
        document.getElementById('secret-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const inputKey = document.getElementById('secret-key').value;
            const messageDiv = document.getElementById('response-message');

            // Codul secret setat implicit (se poate schimba)
            const secretCode = "esmaralda123";

            if (inputKey === secretCode) {
                messageDiv.className = "message success";
                messageDiv.textContent = "Acces permis! Bine ai venit la secretele Esmaraldei.";
            } else {
                messageDiv.className = "message error";
                messageDiv.textContent = "Cod incorect! Încearcă din nou.";
            }
        });
    </script><script>
  document.getElementById('secret-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const inputField = document.getElementById('secret-key');
    const messageDiv = document.getElementById('message');
    const userMessage = inputField.value.trim();

    if (!userMessage) return;

    // Afișăm un mesaj temporar de încărcare
    messageDiv.className = "message";
    messageDiv.textContent = "Esmeralda gândește...";

    try {
      const response = await fetch('https://nameless-block-036e.petre-cezar06.workers.dev/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ message: userMessage })
      });

      const data = await response.text();
      
      // Afișăm răspunsul primit de la Worker
      messageDiv.textContent = data;
      inputField.value = ''; // Golim câmpul de text
    } catch (error) {
      console.error('Eroare:', error);
      messageDiv.textContent = "Eroare la conectarea cu Esmeralda.";
    }
  });
</script>


</body>
</html>
