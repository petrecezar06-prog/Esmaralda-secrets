<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4a154b">
  <title>Esmeralda Secrets - AI Assistant</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #18181b;
      --accent-color: #4a154b;
      --accent-glow: #8b5cf6;
      --text-color: #f3f4f6;
      --text-muted: #9ca3af;
      --user-msg-bg: linear-gradient(135deg, #6b21a8, #4a154b);
      --bot-msg-bg: #27272a;
      --border-color: #3f3f46;
      --error-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* Header */
    header {
      background-color: rgba(24, 24, 27, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #4a154b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.4);
    }

    .brand-info h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #10b981;
      box-shadow: 0 0 6px #10b981;
    }

    /* Chat Container */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .welcome-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 8px;
      text-align: center;
    }

    .welcome-card h2 {
      font-size: 1.2rem;
      color: var(--accent-glow);
      margin-bottom: 8px;
    }

    .welcome-card p {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .suggestions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 12px;
    }

    .chip {
      background-color: #27272a;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip:hover {
      border-color: var(--accent-glow);
      background-color: #3f3f46;
    }

    /* Messages */
    .message {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
    }

    .message.bot {
      align-self: flex-start;
    }

    .message-content {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .message.user .message-content {
      background: var(--user-msg-bg);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.bot .message-content {
      background-color: var(--bot-msg-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
    }

    .message.error .message-content {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error-color);
      color: #fca5a5;
    }

    .message-time {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-top: 4px;
      align-self: flex-end;
    }

    .message.bot .message-time {
      align-self: flex-start;
    }

    /* Typing indicator */
    .typing {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 16px;
      background-color: var(--bot-msg-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      width: fit-content;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-glow);
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Input Area */
    footer {
      padding: 12px 16px;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
    }

    .input-form {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .input-form input {
      flex: 1;
      background-color: #0d0d0d;
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 12px 16px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-form input:focus {
      border-color: var(--accent-glow);
    }

    .input-form button {
      background: linear-gradient(135deg, #8b5cf6, #4a154b);
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    .input-form button:hover {
      opacity: 0.9;
    }

    .input-form button:active {
      transform: scale(0.95);
    }

    .input-form button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .send-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="avatar">🔮</div>
      <div class="brand-info">
        <h1>Esmeralda Secrets</h1>
        <div class="status">
          <span class="status-dot"></span>
          <span>Online &bull; Cloudflare Worker</span>
        </div>
      </div>
    </div>
  </header>

  <main id="chatContainer">
    <div class="welcome-card">
      <h2>Bine ai venit! 🔮</h2>
      <p>Sunt Esmeralda. Adresează-mi o întrebare și îți voi răspunde cu drag.</p>
      <div class="suggestions">
        <button class="chip" onclick="sendQuickMessage('Cine ești?')">Cine ești?</button>
        <button class="chip" onclick="sendQuickMessage('Ce poți face?')">Ce poți face?</button>
        <button class="chip" onclick="sendQuickMessage('Spune-mi o curiozitate!')">Curiozitate</button>
      </div>
    </div>
  </main>

  <footer>
    <form class="input-form" id="chatForm" onsubmit="handleSubmit(event)">
      <input type="text" id="userInput" placeholder="Scrie un mesaj..." autocomplete="off" required />
      <button type="submit" id="sendBtn" title="Trimite mesaj">
        <svg class="send-icon" viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </form>
  </footer>

  <script>
    const WORKER_URL = 'https://nameless-block-036e.petrecezar06.workers.dev';
    const chatContainer = document.getElementById('chatContainer');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    function getCurrentTime() {
      const now = new Date();
      return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function appendMessage(sender, text, isError = false) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender} ${isError ? 'error' : ''}`;

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      contentDiv.textContent = text;

      const timeDiv = document.createElement('div');
      timeDiv.className = 'message-time';
      timeDiv.textContent = getCurrentTime();

      msgDiv.appendChild(contentDiv);
      msgDiv.appendChild(timeDiv);

      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function showTypingIndicator() {
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message bot';
      typingDiv.id = 'typingIndicator';
      typingDiv.innerHTML = `
        <div class="typing">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      `;
      chatContainer.appendChild(typingDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) {
        indicator.remove();
      }
    }

    async function sendToWorker(messageText) {
      userInput.value = '';
      appendMessage('user', messageText);
      showTypingIndicator();

      sendBtn.disabled = true;
      userInput.disabled = true;

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ message: messageText })
        });

        if (!response.ok) {
          throw new Error(`Server status: ${response.status} ${response.statusText}`);
        }

        const data = await response.json();
        removeTypingIndicator();

        const reply = data.reply || data.message || JSON.stringify(data);
        appendMessage('bot', reply);
      } catch (err) {
        removeTypingIndicator();
        console.error('Fetch error:', err);
        appendMessage('bot', `⚠️ Eroare de conectare: ${err.message}. Verifică CORS sau conexiunea la Worker.`, true);
      } finally {
        sendBtn.disabled = false;
        userInput.disabled = false;
        userInput.focus();
      }
    }

    function handleSubmit(e) {
      e.preventDefault();
      const text = userInput.value.trim();
      if (text) {
        sendToWorker(text);
      }
    }

    function sendQuickMessage(text) {
      sendToWorker(text);
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
