<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esmeralda Secrets - Local Core</title>
  
  <style>
    :root {
      --bg-color: #0f172a;
      --chat-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #ec4899;
      --user-msg: #3b82f6;
      --bot-msg: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    header {
      background-color: var(--chat-bg);
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
    }

    .header-left {
      display: flex;
      align-items: center;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      margin-right: 12px;
    }

    .header-info h1 {
      font-size: 16px;
    }

    .header-info p {
      font-size: 11px;
      color: #94a3b8;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .message.bot {
      background-color: var(--bot-msg);
      align-self: flex-start;
    }

    .message.user {
      background-color: var(--user-msg);
      align-self: flex-end;
    }

    .input-container {
      padding: 12px 15px;
      background-color: var(--chat-bg);
      display: flex;
      gap: 10px;
      border-top: 1px solid #334155;
    }

    input[type="text"] {
      flex: 1;
      background-color: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-color);
      font-size: 14px;
      outline: none;
    }

    button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 18px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="avatar">E</div>
      <div class="header-info">
        <h1>Esmeralda Secrets</h1>
        <p>Sistem Independent • Online</p>
      </div>
    </div>
  </header>

  <div class="chat-container" id="chatContainer">
    <div class="message bot">
      Salut, Petre! Am activat nucleul independent. Scrie orice întrebare sau solicitare.
    </div>
  </div>

  <div class="input-container">
    <input type="text" id="userInput" placeholder="Scrie mesajul tău..." autocomplete="off">
    <button onclick="sendMessage()">Trimite</button>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById('userInput');
      const container = document.getElementById('chatContainer');
      const text = input.value.trim();

      if (!text) return;

      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.textContent = text;
      container.appendChild(userMsg);

      input.value = '';
      container.scrollTop = container.scrollHeight;

      const botMsg = document.createElement('div');
      botMsg.className = 'message bot';
      botMsg.textContent = "Esmeralda gândește...";
      container.appendChild(botMsg);
      container.scrollTop = container.scrollHeight;

      try {
        const workerUrl = 'https://nameless-block-036e.petre-cezar06.workers.dev';

        const response = await fetch(workerUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ message: text })
        });

        const data = await response.json();
        
        // Am actualizat aici ca să citească corect 'response' sau 'reply' sau 'error'
        if (data.response) {
          botMsg.textContent = data.response;
        } else if (data.reply) {
          botMsg.textContent = data.reply;
        } else if (data.error) {
          botMsg.textContent = "Eroare: " + data.error;
        } else {
          botMsg.textContent = "Răspuns nevalid de la server.";
        }

      } catch (error) {
        botMsg.textContent = "Eroare de conexiune cu Cloudflare Worker.";
      }

      container.scrollTop = container.scrollHeight;
    }

    document.getElementById('userInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') sendMessage();
    });
  </script>

</body>
</html>
