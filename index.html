<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Esmeralda</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; padding: 20px; }
        input, button { padding: 10px; font-size: 16px; margin-top: 10px; width: 100%; }
        #output { margin-top: 20px; background: #222; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>
    <h2>Test Conexiune Worker</h2>
    <input type="text" id="txt" placeholder="Scrie ceva...">
    <button onclick="testServer()">Trimite la Server</button>
    <div id="output">Răspunsul va apărea aici...</div>

    <script>
        async function testServer() {
            const val = document.getElementById('txt').value;
            const out = document.getElementById('output');
            out.textContent = "Se trimite...";
            
            try {
                // Folosim Workerul tău direct
                const res = await fetch('https://nameless-block-036e.petrecezar06.workers.dev?msg=' + encodeURIComponent(val));
                const data = await res.json();
                out.textContent = "Răspuns: " + JSON.stringify(data);
            } catch (err) {
                out.textContent = "Eroare fetch: " + err.message;
            }
        }
    </script>
</body>
</html>
