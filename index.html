<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esmeralda Secrets</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #1f1f1f;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid #333;
            color: #d1c4e9;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 10px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user {
            background-color: #6a1b9a;
            color: white;
            align-self: flex-end;
        }
        .assistant {
            background-color: #2d2d2d;
            color: #e0e0e0;
            align-self: flex-start;
            border: 1px solid #444;
        }
        #input-container {
            display: flex;
            padding: 15px;
            background-color: #1f1f1f;
            border-top: 1px solid #333;
        }
        #user-input {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #2d2d2d;
            color: white;
            font-size: 1rem;
        }
        #send-btn {
            background-color: #7b1fa2;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-left: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #send-btn:hover {
            background-color: #9c27b0;
        }
    </style>
</head>
<body>

    <header>Esmeralda Secrets</header>

    <div id="chat-container">
        <div class="message assistant">Salut! Sunt Esmeralda Secrets. Cu ce te pot ajuta astăzi?</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Scrie un mesaj..." autocomplete="off">
        <button id="send-btn" onclick="sendMessage()">Trimite</button>
    </div>

    <script>
        const WORKER_URL = "https://nameless-block-036e.workers.dev";
        let conversationHistory = [];

        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            inputField.value = '';

            conversationHistory.push({ role: 'user', content: text });

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ messages: conversationHistory })
                });

                const data = await response.json();

                if (data.success && (data.reply || data.response)) {
                    const replyText = data.reply || data.response;
                    appendMessage(replyText, 'assistant');
                    conversationHistory.push({ role: 'assistant', content: replyText });
                } else {
                    appendMessage("Eroare: " + (data.error || "Răspuns invalid de la server."), 'assistant');
                }
            } catch (err) {
                appendMessage("Eroare de conexiune cu worker-ul: " + err.message, 'assistant');
            }
        }

        function appendMessage(text, sender) {
            const chatContainer = document.getElementById('chat-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.textContent = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
