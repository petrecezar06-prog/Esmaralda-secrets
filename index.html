<script>
const WORKER_URL = 'https://nameless-block-036e.ar06.workers.dev';

async function sendMessage() {
  const inputElement = document.querySelector('.chat-input input') || document.getElementById('user-input');
  const userMessage = inputElement.value.trim();
  if (!userMessage) return;

  // Afișează mesajul utilizatorului
  appendMessage('user', userMessage);
  inputElement.value = '';

  // Indicator de încărcare
  const loadingId = appendMessage('assistant', 'Esmeralda consultă sferele...');

  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: userMessage }),
    });

    const data = await response.json();

    if (response.ok && data.reply) {
      updateMessage(loadingId, data.reply);
    } else {
      updateMessage(loadingId, 'A apărut o eroare în conexiunea mistică.');
    }
  } catch (error) {
    console.error('Eroare:', error);
    updateMessage(loadingId, 'Nu am putut conecta cererea la Esmeralda.');
  }
}

function appendMessage(role, text) {
  const chatBox = document.querySelector('.chat-messages') || document.getElementById('chat-box');
  const msgElement = document.createElement('div');
  const msgId = 'msg-' + Date.now();
  
  msgElement.id = msgId;
  msgElement.className = `message ${role}-message`;
  msgElement.textContent = text;
  
  chatBox.appendChild(msgElement);
  chatBox.scrollTop = chatBox.scrollHeight;
  
  return msgId;
}

function updateMessage(id, text) {
  const msgElement = document.getElementById(id);
  if (msgElement) {
    msgElement.textContent = text;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const sendBtn = document.querySelector('.send-btn') || document.getElementById('send-btn');
  const inputElement = document.querySelector('.chat-input input') || document.getElementById('user-input');

  if (sendBtn) sendBtn.addEventListener('click', sendMessage);
  if (inputElement) {
    inputElement.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  }
});
</script>
