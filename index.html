<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esmeralda Secrets</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f0a1c;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: space-between;
    }
    header {
      padding: 16px;
      background: #1a102f;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #2d1b4e;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #7c3aed;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .status {
      font-size: 12px;
      color: #10b981;
    }
    #chatContainer {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }
    .user {
      align-self: flex-end;
      background-color: #6d28d9;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .bot {
      align-self: flex-start;
      background-color: #261646;
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
    }
    .error-msg {
      align-self: center;
      background-color: #450a0a;
      color: #fca5a5;
      border: 1px solid #991b1b;
      border-radius: 8px;
      text-align: center;
    }
    footer {
      padding: 16px;
      background: #1a102f;
      display: flex;
      gap: 8px;
      border-top: 1px solid #2d1b4e;
    }
    input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 24px;
      border: 1px solid #3b2164;
      background: #0f0a1c;
      color: #fff;
      outline: none;
    }
    button {
      padding: 12px 20px;
      border-radius: 24px;
      border: none;
      background: #7c3aed;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <header>
    <div class="avatar">E</div>
    <div>
      <h3>Esmeralda Secrets</h3>
      <span class="status">● Online</span>
    </div>
  </header>

  <div id="chatContainer">
    <div class="message bot">
      Salut! Sunt <b>Esmeralda</b>, inteligența ta personală. Cu ce te pot ajuta astăzi?
    </div>
  </div>

  <footer>
    <input type="text" id="userInput" placeholder="Scrie un mesaj..." />
    <button id="sendBtn" onclick="sendMessage()">Trimite</button>
  </footer>

  <script>
    const WORKER_URL = 'https://nameless-block-036e.petrecezar06.workers.dev';

    const chatContainer = document.getElementById('chatContainer');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      userInput.value = '';
      sendBtn.disabled = true;

      showTyping(true);

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ message: text })
        });

        showTyping(false);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText || 'Eroare Server'}`);
        }

        const data = await response.json();
        const replyText = data.reply || data.response || data.message || "Răspuns gol de la server.";
        appendMessage(replyText, 'bot');

      } catch (err) {
        showTyping(false);
        console.error("Eroare la conectare:", err);
        const detailMsg = err && err.name ? `${err.name}: ${err.message}` : String(err);
        appendMessage(`Eroare conexiune: ${detailMsg}`, 'error-msg');
      } finally {
        sendBtn.disabled = false;
      }
    }

    function appendMessage(text, type) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${type}`;
      msgDiv.textContent = text;
      chatContainer.appendChild(msgDiv);
      scrollToBottom();
    }

    let typingDiv = null;
    function showTyping(show) {
      if (show) {
        typingDiv = document.createElement('div');
        typingDiv.className = 'message bot';
        typingDiv.textContent = 'Esmeralda scrie...';
        chatContainer.appendChild(typingDiv);
      } else if (typingDiv) {
        typingDiv.remove();
        typingDiv = null;
      }
      scrollToBottom();
    }

    function scrollToBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
  </script>
</body>
</html>
