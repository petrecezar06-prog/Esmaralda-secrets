<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esmeralda Secrets</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.4;
        }
        .user-message {
            background-color: #6200ee;
            align-self: flex-end;
        }
        .bot-message {
            background-color: #333333;
            align-self: flex-start;
        }
        .error-message {
            background-color: #b00020;
            align-self: center;
            text-align: center;
        }
        #input-container {
            display: flex;
            padding: 15px;
            background-color: #1e1e1e;
            border-top: 1px solid #333;
        }
        #user-input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: white;
            font-size: 16px;
        }
        #send-button {
            background-color: #6200ee;
            color: white;
            border: none;
            padding: 0 20px;
            margin-left: 10px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        #send-button:hover {
            background-color: #7c4dff;
        }
    </style>
</head>
<body>

    <div id="chat-container">
        <div class="message bot-message">Salut! Sunt Esmeralda, inteligența ta personală. Cu ce te pot ajuta astăzi?</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Scrie un mesaj..." autocomplete="off">
        <button id="send-button" onclick="sendMessage()">Trimite</button>
    </div>

    <script>
        // ADRESA TA EXACTĂ DE CLOUDFLARE WORKER (cu subdomeniul tău personal)
        const WORKER_URL = "https://nameless-block-036e.petre-cezar06.workers.dev";

        const chatContainer = document.getElementById("chat-container");
        const userInput = document.getElementById("user-input");

        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Afișează mesajul utilizatorului în chat
            appendMessage(text, "user-message");
            userInput.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Indicator de încărcare temporar
            const loadingId = appendMessage("Se gândește...", "bot-message");

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-3.5-turbo",
                        messages: [
                            { role: "system", content: "Ești Esmeralda, un asistent virtual inteligent și prietenos care răspunde în limba română." },
                            { role: "user", content: text }
                        ]
                    })
                });

                // Elimină mesajul de încărcare
                document.getElementById(loadingId).remove();

                if (!response.ok) {
                    throw new Error(`Eroare HTTP: ${response.status}`);
                }

                const data = await response.json();
                
                // Extrage răspunsul de la modelul AI (OpenRouter / OpenAI format)
                let reply = "Nu am primit un răspuns valid.";
                if (data.choices && data.choices.length > 0) {
                    reply = data.choices[0].message.content;
                } else if (data.error) {
                    reply = `Eroare server: ${data.error.message || data.error}`;
                }

                appendMessage(reply, "bot-message");

            } catch (error) {
                // Elimină mesajul de încărcare dacă a eșuat
                const loadingElem = document.getElementById(loadingId);
                if (loadingElem) loadingElem.remove();

                console.error("Eroare fetch:", error);
                appendMessage(`Eroare conexiune: Nu s-a putut comunica cu serverul (${WORKER_URL}). Verifică publicarea Cloudflare Worker. (${error.message})`, "error-message");
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendMessage(text, className) {
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${className}`;
            messageDiv.innerText = text;
            const id = "msg-" + Date.now() + "-" + Math.random();
            messageDiv.id = id;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
