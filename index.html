  <script>
    const WORKER_URL = 'https://nameless-block-036e.petre-cezar06.workers.dev/';

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const chatBox = document.getElementById('chatBox');
      const text = input.value.trim();
      
      if (!text) return;

      // Afișează mesajul utilizatorului
      const userDiv = document.createElement('div');
      userDiv.className = 'message user-message';
      userDiv.textContent = text;
      chatBox.appendChild(userDiv);
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // Mesaj de încărcare
      const botDiv = document.createElement('div');
      botDiv.className = 'message bot-message';
      botDiv.textContent = 'Esmeralda gândește...';
      chatBox.appendChild(botDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });

        const data = await response.json();
        
        // Extrage corect textul din structura venită de la OpenRouter
        if (data.choices && data.choices.length > 0 && data.choices[0].message) {
          botDiv.textContent = data.choices[0].message.content;
        } else if (data.error) {
          botDiv.textContent = 'Eroare API: ' + (data.error.message || JSON.stringify(data.error));
        } else {
          botDiv.textContent = 'Nu am putut citi răspunsul de la Esmeralda.';
        }
      } catch (error) {
        botDiv.textContent = 'Eroare de conexiune cu serverul.';
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    document.getElementById('userInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
