<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esmeralda AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #08120e; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .chat-container { background: #0f1c15; border: 1px solid #d4af37; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7); max-width: 450px; width: 100%; height: 90vh; max-height: 650px; display: flex; flex-direction: column; overflow: hidden; }
        .header { padding: 20px; text-align: center; border-bottom: 1px solid rgba(212, 175, 55, 0.2); background: rgba(15, 28, 21, 0.9); }
        .header h1 { color: #f3e5ab; font-size: 1.6rem; letter-spacing: 1px; }
        .header p { color: #6b8e23; font-size: 0.85rem; margin-top: 4px; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .message.assistant { background-color: #1a2e22; color: #e2e8f0; align-self: flex-start; border-left: 3px solid #d4af37; }
        .message.user { background-color: #3a2a18; color: #fce8cd; align-self: flex-end; border-right: 3px solid #d4af37; }
        .input-area { padding: 15px; display: flex; gap: 10px; border-top: 1px solid rgba(212, 175, 55, 0.2); background: #0b1510; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #2d4a35; background-color: #050a07; color: #fff; font-size: 0.95rem; outline: none; }
        input:focus { border-color: #d4af37; }
        button { padding: 12px 20px; background-color: #d4af37; color: #08120e; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #f3e5ab; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <h1>✦ Esmeralda ✦</h1>
            <p>Inteligența ta personală</p>
        </div>
        <div class="chat-box" id="chatBox">
            <div class="message assistant">Bună. Eu sunt Esmeralda. 🌙<br>Sunt aici. Cu ce te pot ajuta astăzi?</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Scrie-i Esmeraldei..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Trimite</button>
        </div>
    </div>
    <script>
        function appendMessage(text, sender) {
            const chatBox = document.getElementById("chatBox");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${sender}`;
            msgDiv.innerHTML = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, "user");
            input.value = "";
            const loadingMsg = appendMessage("Esmeralda se gândește...", "assistant");

            try {
                const response = await fetch("https://nameless-block-036e.petre-cezar06.workers.dev/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });
                const replyText = await response.text();
                loadingMsg.innerText = replyText;
            } catch (err) {
                loadingMsg.innerText = "A apărut o eroare la conectare.";
            }
        }
    </script>
</body>
</html>
