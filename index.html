<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esmeralda Secrets</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a0933;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .chat-container {
      width: 100%;
      max-width: 600px;
      height: 80vh;
      background: #28114a;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      padding: 10px 15px;
      border-radius: 8px;
      max-width: 80%;
      word-wrap: break-word;
    }
    .user-message {
      background: #6b21a8;
      align-self: flex-end;
    }
    .bot-message {
      background: #4c1d95;
      align-self: flex-start;
    }
    .input-container {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    input {
      flex: 1;
      padding: 10px;
      border-radius: 5px;
      border: none;
      background: #1f073b;
      color: #fff;
    }
    button {
      padding: 10px 20px;
      border: none;
      background: #fbbf24;
      color: #000;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <h2>🔮 Esmeralda Secrets</h2>
    <div id="chatBox" class="chat-box"></div>
    <div class="input-container">
      <input type="text" id="userInput" placeholder="Întreabă-o pe Esmeralda...">
      <button onclick="sendMessage()">Trimite</button>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://nameless-block-036e.petre-cezar06.workers.dev/';

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const chatBox = document.getElementById('chatBox');
      const text = input.value.trim();
      
      if (!text) return;

      // Afișează mesajul utilizatorului
      const userDiv = document.createElement('div');
      userDiv.className = 'message user-message';
      userDiv.textContent = text;
      chatBox.appendChild(userDiv);
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // Mesaj de încărcare
      const botDiv = document.createElement('div');
      botDiv.className = 'message bot-message';
      botDiv.textContent = 'Esmeralda gândește...';
      chatBox.appendChild(botDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });

        const data = await response.json();
        if (data.reply) {
          botDiv.textContent = data.reply;
        } else {
          botDiv.textContent = 'Nu am putut conecta cererea la Esmeralda.';
        }
      } catch (error) {
        botDiv.textContent = 'Eroare de conexiune cu serverul.';
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    document.getElementById('userInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') sendMessage();
    });
  </script>

</body>
</html>
