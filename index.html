<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esmeralda Secrets</title>
    
    <!-- Legături esențiale pentru a rula ca aplicație nativă pe tot ecranul -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4a154b">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .input-container {
            display: flex;
            padding: 10px;
            background-color: #1a1a1a;
            border-top: 1px solid #333;
        }
        input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            background-color: #2a2a2a;
            color: white;
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            margin-left: 10px;
            border: none;
            border-radius: 4px;
            background-color: #4a154b;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div style="background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 10px;">
            Sistem Independent • Online. Salut! Cu ce te pot ajuta astăzi?
        </div>
    </div>

    <div class="input-container">
        <input type="text" placeholder="Scrie mesajul tău...">
        <button>Trimite</button>
    </div>

</body>
</html>
